services:
  mysql:
    image: mysql:8.0
    container_name: sodda-mysql-1
    restart: always
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment if you want to auto-load the dump on first start
      # - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

  bot:
    build: .
    container_name: sodda-bot
    restart: always
    env_file: .env
    depends_on:
      - mysql
    volumes:
      - .:/app
      - chroma_db:/app/chroma_db

volumes:
  db_data:
  chroma_db:
