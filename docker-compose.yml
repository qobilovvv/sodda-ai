services:
  mysql:
    image: mysql:8.0
    container_name: sodda-mysql-1
    restart: always
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Option: uncomment the line below to auto-load the dump on first start
      # - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

volumes:
  db_data:
